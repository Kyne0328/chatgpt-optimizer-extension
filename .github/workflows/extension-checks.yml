name: Extension checks

on:
  push:
  pull_request:

jobs:
  performance-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run performance regression guard
        run: node scripts/perf-regression-check.js
      - name: Test long-chat payload window
        run: node scripts/long-chat-window-test.js
